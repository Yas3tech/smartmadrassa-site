<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>SmartMadrassa | Bientôt en ligne</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <style>
    :root {
      --bg: #faf9f6;
      --text: #0f172a;
      --muted: #64748b;
      --line: rgba(15, 23, 42, 0.08);
      --brand: #ea580c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #04070f;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --line: rgba(241, 245, 249, 0.1);
        --brand: #f97316;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main { width: 100%; max-width: 520px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { margin-top: 24px; font-size: 1.75rem; line-height: 1.25; }
    p { margin-top: 12px; color: var(--muted); }
    .langs { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line); }
    .langs p { margin-top: 8px; font-size: 0.95rem; }
    a { color: var(--brand); font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="SmartMadrassa" />
    <h1>Le site arrive bientôt</h1>
    <p>SmartMadrassa, la plateforme de gestion pour écoles associatives et instituts, prépare son nouveau site.</p>
    <p>Une question ? Écrivez à <a href="mailto:contact@smartmadrassa.be">contact@smartmadrassa.be</a></p>
    <div class="langs">
      <p lang="nl">De website is binnenkort beschikbaar.</p>
      <p lang="ar" dir="rtl">الموقع سيكون متاحًا قريبًا.</p>
    </div>
  </main>
</body>
</html>
