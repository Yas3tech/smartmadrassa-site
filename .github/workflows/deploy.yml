name: Déploiement OVH

# Compile le site et l'envoie par FTPS dans www/ à chaque push sur main.
# Le déclenchement manuel (workflow_dispatch) permet de renvoyer le site
# sans avoir à faire un commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois : évite que deux envois FTP se chevauchent.
concurrency:
  group: deploiement-ovh
  cancel-in-progress: false

jobs:
  deployer:
    name: Compiler et publier
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérifier les types
        run: pnpm exec tsc -b

      - name: Compiler
        run: pnpm build

      - name: Vérifier que le build est complet
        run: |
          set -e
          for f in index.html 404.html .htaccess robots.txt sitemap.xml og-image.png api/contact.php theme-init.js pages/mentions-legales.html pages/confidentialite.html pages/conditions-utilisation.html; do
            if [ ! -f "dist/$f" ]; then
              echo "::error::Fichier manquant dans dist/ : $f"
              exit 1
            fi
          done
          echo "Build complet — $(du -sh dist | cut -f1)"

      # Publication par SFTP via scripts/deploy-sftp.mjs.
      #
      # Pourquoi pas une action toute faite : cet hébergement OVH refuse FTPS
      # (AUTH TLS comme mode implicite) et n'ouvre pas de shell SSH. Les actions
      # courantes reposent soit sur FTPS, soit sur `ssh <commande>` ou rsync,
      # soit sur un motif `dist/*` qui laisse .htaccess de côté — et sans lui le
      # site perd HTTPS, le routage des pages et les en-têtes de sécurité.
      - name: Publier sur OVH par SFTP
        env:
          SFTP_HOST: ${{ secrets.OVH_FTP_HOST }}
          SFTP_USER: ${{ secrets.OVH_FTP_USER }}
          SFTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ vars.OVH_REMOTE_PATH }}
        run: node scripts/deploy-sftp.mjs

      - name: Vérifier que le site répond
        run: |
          set -e
          sleep 5
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://smartmadrassa.be/)
          echo "https://smartmadrassa.be/ → HTTP $code"
          [ "$code" = "200" ] || { echo "::error::Le site ne répond pas correctement"; exit 1; }
