    <style>
      html { background: #faf9f6; }

      #boot {

        background: #faf9f6; z-index: 60; transition: opacity .45s ease;
      }
      #boot.out { opacity: 0; pointer-events: none; }

      #boot i {

        border: 2px solid rgba(249,115,22,.18); border-top-color: #f97316;
        display: block; animation: bspin .8s linear infinite;
      }
      @keyframes bspin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot i { animation: none; } }
